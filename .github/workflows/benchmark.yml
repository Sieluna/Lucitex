name: Benchmark

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Comma-separated suites (all/core/convert/jpeg/png/exr/ktx2/webp/kernels; "all" wins if present)
        type: string
        default: all
      comparable:
        description: Filter suite to formats/routes with 2+ selected supporting libraries (not kernels or core)
        type: boolean
        default: false
      cases:
        description: Comma-separated procedural cases
        type: string
        default: ramp@128x128,alpha@128x128,noise@128x128,ramp@512x512,alpha@512x512,noise@512x512,checker@513x385,ramp@2048x2048,alpha@2048x2048,noise@2048x2048
      profiles:
        description: Comma-separated profiles, or all
        type: string
        default: jpeg-quality420,jpeg-rate420,png-default,exr-half-zip,ktx2-rgba8-none,webp-lossless
      mode:
        description: Full adaptive measurement or smoke check
        type: choice
        options: [full, smoke]
        default: full
      memory:
        description: Memory measurement mode
        type: choice
        options: [process, managed]
        default: process

permissions:
  contents: read

jobs:
  benchmark:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    defaults:
      run:
        shell: bash

    env:
      BENCH_PROJECT: tests/Lucitex.Benchmarks
      BENCH_OUTPUT: artifacts/benchmark
      BUILD_CONFIGURATION: Release

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: Build
        run: dotnet build "$BENCH_PROJECT" --configuration "$BUILD_CONFIGURATION"

      - name: Run benchmarks
        env:
          BENCH_SUITE: ${{ inputs.suite }}
          BENCH_COMPARABLE: ${{ inputs.comparable }}
          BENCH_CASES: ${{ inputs.cases }}
          BENCH_PROFILES: ${{ inputs.profiles }}
          BENCH_MODE: ${{ inputs.mode }}
          BENCH_MEMORY: ${{ inputs.memory }}
        run: |
          args=(
            --suite "$BENCH_SUITE"
            --cases "$BENCH_CASES"
            --profiles "$BENCH_PROFILES"
            --mode "$BENCH_MODE"
            --memory "$BENCH_MEMORY"
            --output "$BENCH_OUTPUT"
          )
          if [[ "$BENCH_COMPARABLE" == true ]]; then
            args+=(--comparable)
          fi
          dotnet run --project "$BENCH_PROJECT" --configuration "$BUILD_CONFIGURATION" --no-build -- "${args[@]}"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-${{ matrix.os }}
          path: ${{ env.BENCH_OUTPUT }}
          if-no-files-found: warn

  summary:
    name: Summary
    needs: benchmark
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Download results
        if: always()
        uses: actions/download-artifact@v7
        with:
          pattern: benchmark-*
          path: artifacts

      - name: Write job summary
        if: always()
        run: |
          set -euo pipefail
          shopt -s nullglob
          {
            printf '# Benchmark\n\n'
            printf 'Compare within the same OS, case and profile. JPEG pairs use MSE ±5%% or file size ±2%% against a Q90 reference.\n\n'
            printf 'Mean: time/op; Error: 99.9%% confidence interval half-width; Allocated: managed bytes/op; Process peak: sampled whole-process memory, including runtime and native heaps.\n\n'
            printf 'Raw/encoded: compression ratio (higher is smaller); Workload MSE: reconstruction error (lower is better); Delta: signed deviation from the pairing target. Full diagnostics are in the uploaded reports.\n\n'
            if [[ "${{ inputs.mode }}" == smoke ]]; then
              printf '**Smoke run: pipeline verification only; timings are not performance evidence.**\n\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          for dir in artifacts/benchmark-*; do
            os="${dir#artifacts/benchmark-}"
            validation="$dir/validation.json"
            reports=("$dir"/results/*-comparison.md)
            {
              printf '## %s\n\n' "$os"
              if [[ -f "$validation" ]]; then
                jq -r '
                  "Runtime: \(.Runtime) · Codec threads: \(.Options.CodecThreads)\n",
                  "Preflight: \(.Results | length) checked · \(.Errors | length) rejected · \([.Results[] | select(.PairingMatched == false)] | length) unmatched · \(.Skipped | length) unsupported.\n"
                ' "$validation"
              else
                printf 'No validation report. Check logs.\n\n'
              fi

              for report in "${reports[@]}"; do
                cat "$report"
                printf '\n'
              done
              if (( ${#reports[@]} == 0 )); then
                printf 'No timing report available.\n\n'
              fi
              if [[ -f "$validation" ]]; then
                jq -r '
                  if (.Errors | length) > 0 then
                    "<details><summary>Rejected cases (\(.Errors | length))</summary>\n",
                    (.Errors | to_entries | .[:20][] | "- \(.key): \(.value | split("\n")[0] | gsub("[<>]"; ""))"),
                    "\nUp to 20 shown; full diagnostics are in validation.json.\n\n</details>\n"
                  else empty end
                ' "$validation"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          done
