name: Benchmark

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Benchmark suite (all runs every registered suite)
        type: choice
        options: [all, convert, jpeg, png, exr, ktx2, kernels]
        default: all
      cases:
        description: Comma-separated procedural cases
        type: string
        default: ramp@128x128,checker@129x97
      profiles:
        description: Comma-separated profiles, or all
        type: string
        default: jpeg-default420,png-default,exr-half-zip,ktx2-rgba8-none
      mode:
        description: Full measurement or pipeline smoke check
        type: choice
        options: [full, smoke]
        default: full
      memory:
        description: Memory measurement mode
        type: choice
        options: [process, managed]
        default: process

permissions:
  contents: read

jobs:
  benchmark:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    defaults:
      run:
        shell: bash

    env:
      BENCH_PROJECT: tests/Lucitex.Benchmarks
      BENCH_OUTPUT: artifacts/benchmark
      BUILD_CONFIGURATION: Release

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: Build
        run: dotnet build "$BENCH_PROJECT" --configuration "$BUILD_CONFIGURATION"

      - name: Run benchmarks
        env:
          BENCH_SUITE: ${{ inputs.suite }}
          BENCH_CASES: ${{ inputs.cases }}
          BENCH_PROFILES: ${{ inputs.profiles }}
          BENCH_MODE: ${{ inputs.mode }}
          BENCH_MEMORY: ${{ inputs.memory }}
        run: |
          args=(
            --suite "$BENCH_SUITE"
            --cases "$BENCH_CASES"
            --profiles "$BENCH_PROFILES"
            --memory "$BENCH_MEMORY"
            --output "$BENCH_OUTPUT"
            --filter '*'
          )
          if [[ "$BENCH_MODE" == smoke ]]; then
            args+=(--quick)
          fi
          dotnet run --project "$BENCH_PROJECT" --configuration "$BUILD_CONFIGURATION" --no-build -- "${args[@]}"

      - name: Write job summary
        if: always()
        run: |
          set -euo pipefail
          shopt -s nullglob
          validation="$BENCH_OUTPUT/validation.json"
          reports=("$BENCH_OUTPUT"/results/*-comparison.md)
          {
            printf '# Benchmark\n\n'
            printf 'Platform: %s\n\n' "$(uname -s)"
            printf 'Hosted CI results should be compared within the same runner environment. Windows and Linux runners are different machines.\n\n'
            if [[ -f "$validation" ]]; then
              jq -r '
                "Runtime: \(.Runtime). Successful codec checks: \(.Results | length).\n",
                (if (.Errors | length) > 0 then
                  "## Validation failures\n",
                  (.Errors | to_entries | .[:50][] | "- \(.key): \(.value | split("\n")[0])"),
                  "\nShowing up to 50 of \(.Errors | length) failures. See workflow logs for diagnostics.\n"
                else empty end),
                (if (.Skipped | length) > 0 then
                  "<details><summary>Unsupported combinations</summary>\n",
                  (.Skipped | to_entries | .[:50][] | "- \(.key): \(.value)"),
                  "\nShowing up to 50 of \(.Skipped | length) unsupported combinations.\n\n</details>\n"
                else empty end)
              ' "$validation"
            else
              printf 'No validation report was produced. Inspect build/run logs; missing data is not a successful benchmark.\n\n'
            fi

            budget=800000
            for report in "${reports[@]}"; do
              size=$(wc -c < "$report")
              if (( size > budget )); then
                printf 'Remaining tables are omitted because of the summary size limit. See workflow logs for benchmark output.\n\n'
                break
              fi
              cat "$report"
              printf '\n'
              budget=$((budget - size))
            done
            if (( ${#reports[@]} == 0 )); then
              printf 'No completed timing report is available. Check validation failures and workflow logs.\n\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
