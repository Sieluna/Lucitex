name: Benchmark

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Comma-separated suites (all/convert/jpeg/png/exr/ktx2/webp/kernels; "all" wins if present)
        type: string
        default: all
      comparable:
        description: Filter suite to formats/routes with 2+ supporting libraries (never affects kernels)
        type: boolean
        default: false
      cases:
        description: Comma-separated procedural cases
        type: string
        default: ramp@128x128,checker@129x97
      profiles:
        description: Comma-separated profiles, or all
        type: string
        default: jpeg-default420,png-default,exr-half-zip,ktx2-rgba8-none,webp-lossless
      mode:
        description: Full measurement or pipeline smoke check
        type: choice
        options: [full, smoke]
        default: full
      memory:
        description: Memory measurement mode
        type: choice
        options: [process, managed]
        default: process

permissions:
  contents: read

jobs:
  benchmark:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    defaults:
      run:
        shell: bash

    env:
      BENCH_PROJECT: tests/Lucitex.Benchmarks
      BENCH_OUTPUT: artifacts/benchmark
      BUILD_CONFIGURATION: Release

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: Build
        run: dotnet build "$BENCH_PROJECT" --configuration "$BUILD_CONFIGURATION"

      - name: Run benchmarks
        env:
          BENCH_SUITE: ${{ inputs.suite }}
          BENCH_COMPARABLE: ${{ inputs.comparable }}
          BENCH_CASES: ${{ inputs.cases }}
          BENCH_PROFILES: ${{ inputs.profiles }}
          BENCH_MODE: ${{ inputs.mode }}
          BENCH_MEMORY: ${{ inputs.memory }}
        run: |
          args=(
            --suite "$BENCH_SUITE"
            --cases "$BENCH_CASES"
            --profiles "$BENCH_PROFILES"
            --memory "$BENCH_MEMORY"
            --output "$BENCH_OUTPUT"
            --filter '*'
          )
          if [[ "$BENCH_MODE" == smoke ]]; then
            args+=(--quick)
          fi
          if [[ "$BENCH_COMPARABLE" == true ]]; then
            args+=(--comparable)
          fi
          dotnet run --project "$BENCH_PROJECT" --configuration "$BUILD_CONFIGURATION" --no-build -- "${args[@]}"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-${{ matrix.os }}
          path: ${{ env.BENCH_OUTPUT }}
          if-no-files-found: warn

  summary:
    name: Summary
    needs: benchmark
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Download results
        if: always()
        uses: actions/download-artifact@v7
        with:
          pattern: benchmark-*
          path: artifacts

      - name: Write job summary
        if: always()
        run: |
          set -euo pipefail
          shopt -s nullglob
          {
            printf '# Benchmark\n\n'
            printf 'Compare only within the same OS; Windows and Linux runners differ.\n'
            printf 'Single-implementation groups have no winner. EXR: normalized byte/HALF samples, not HDR fidelity. KTX2: RGBA8 container conversion, not GPU block encoding.\n\n'
            if [[ "${{ inputs.mode }}" == smoke ]]; then
              printf '**Smoke run: timings and ranks are not performance evidence.**\n\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          for dir in artifacts/benchmark-*; do
            os="${dir#artifacts/benchmark-}"
            validation="$dir/validation.json"
            reports=("$dir"/results/*-comparison.md)
            {
              printf '## %s\n\n' "$os"
              if [[ -f "$validation" ]]; then
                jq -r '
                  "Runtime: \(.Runtime) · Checks: \(.Results | length)\n",
                  (if (.Errors | length) > 0 then
                    "### Failures (\(.Errors | length))\n",
                    (.Errors | to_entries | .[:50][] | "- \(.key): \(.value | split("\n")[0])"),
                    "\n(showing 50; full log in workflow run)\n"
                  else empty end),
                  (if (.Skipped | length) > 0 then
                    "<details><summary>Skipped (\(.Skipped | length))</summary>\n",
                    (.Skipped | to_entries | .[:50][] | "- \(.key): \(.value)"),
                    "\n</details>\n"
                  else empty end)
                ' "$validation"
              else
                printf 'No validation report. Check logs.\n\n'
              fi

              for report in "${reports[@]}"; do
                awk '/^##/ || /^\|/' "$report"
                printf '\n'
              done
              if (( ${#reports[@]} == 0 )); then
                printf 'No timing report available.\n\n'
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          done
