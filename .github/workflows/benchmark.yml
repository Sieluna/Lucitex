name: Benchmark comparisons

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Benchmark suite (all runs every registered suite)
        type: choice
        options: [all, convert, jpeg, png, exr, ktx2, kernels]
        default: all
      cases:
        description: Comma-separated procedural cases
        type: string
        default: ramp@128x128,checker@129x97
      profiles:
        description: Comma-separated profiles, or all
        type: string
        default: jpeg-default420,png-default,exr-half-zip,ktx2-rgba8-none
      mode:
        description: Full measurement or pipeline smoke check
        type: choice
        options: [full, smoke]
        default: full
      memory:
        description: Memory measurement mode
        type: choice
        options: [process, managed]
        default: process

permissions:
  contents: read

jobs:
  compare:
    name: Compare (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    env:
      BENCH_SUITE: ${{ inputs.suite }}
      BENCH_CASES: ${{ inputs.cases }}
      BENCH_PROFILES: ${{ inputs.profiles }}
      BENCH_MODE: ${{ inputs.mode }}
      BENCH_MEMORY: ${{ inputs.memory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x
      - name: Build comparator
        run: dotnet build tests/Lucitex.Benchmarks -c Release
      - name: Run BenchmarkDotNet comparisons
        run: |
          $benchmarkArgs = @(
            'tests/Lucitex.Benchmarks/bin/Release/net10.0/Lucitex.Benchmarks.dll',
            '--suite', $env:BENCH_SUITE,
            '--cases', $env:BENCH_CASES,
            '--profiles', $env:BENCH_PROFILES,
            '--memory', $env:BENCH_MEMORY,
            '--output', 'artifacts/benchmark',
            '--filter', '*'
          )
          if ($env:BENCH_MODE -eq 'smoke') { $benchmarkArgs += '--quick' }
          & dotnet @benchmarkArgs
          exit $LASTEXITCODE
      - name: Write job summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          {
            printf '# Lucitex benchmark comparisons\n\n'
            printf 'Platform: %s\n\n' "$(uname -s)"
            printf 'Hosted CI results should be compared within the same runner environment. Windows and Linux runners are different machines.\n\n'
            if [[ -f artifacts/benchmark/validation.json ]]; then
              jq -r '"Runtime: \(.Runtime). Successful codec checks: \(.Results | length).\n"' artifacts/benchmark/validation.json
              jq -r 'if (.Errors | length) > 0 then
                "## Validation failures\n", (.Errors | to_entries | .[:50][] | "- \(.key): \(.value | split("\n")[0])"),
                "\nFull failure details are in validation.json.\n" else empty end' artifacts/benchmark/validation.json
              jq -r 'if (.Skipped | length) > 0 then
                "<details><summary>Unsupported combinations</summary>\n",
                (.Skipped | to_entries | .[:50][] | "- \(.key): \(.value)"),
                "\nFull exclusions are in validation.json.\n\n</details>\n" else empty end' artifacts/benchmark/validation.json
            else
              printf 'No validation report was produced. Inspect build/run logs; missing data is not a successful benchmark.\n\n'
            fi
            reports=(artifacts/benchmark/results/*-comparison.md)
            budget=800000
            for report in "${reports[@]}"; do
              size=$(wc -c < "$report")
              if (( size > budget )); then
                printf 'Remaining tables are in the uploaded artifacts (summary size limit).\n\n'
                break
              fi
              cat "$report"
              printf '\n'
              budget=$((budget - size))
            done
            if (( ${#reports[@]} == 0 )); then
              printf 'No completed timing report is available. Check validation failures and workflow logs.\n\n'
            fi
            printf 'Download the workflow artifact for HTML highlighting, CSV, full BenchmarkDotNet JSON, hashes, native library provenance and memory details.\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ matrix.os }}-${{ github.run_id }}
          path: artifacts/benchmark
          if-no-files-found: warn
          retention-days: 30
